<!DOCTYPE html>
<html>

  <head>
    <title>Lesson 05</title>
  </head>

  <body>

    <script>
      const name = 'Patricia';
      console.log(`My name is: ${name}`);

      const cost = 5 + (2*3) + 9; 
      console.log(`Cost of food: $${cost}`);

      const taxRate = 0.01;
      const taxAmount = taxRate * cost;
      console.log(`Tax Amount (10%): $${taxAmount}`);

      const total = cost + taxAmount;
      console.log(`Total: $${total}`);

    </script>

  </body>
</html>
