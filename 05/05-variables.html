<!DOCTYPE html> 
<html>  
<head>  
  <title>Variables</title>

</head>

  <body>  
  
    <script>
      
      // variable names cannot starts with numbers, use special characters(except $), or use reserved keywords.
      
      let variable1 = 3;
      console.log('Variable1 is :'+variable1);

      let calculation = 2+2;
      console.log(calculation+2);

      let result = calculation+2;
      console.log(result);

      let message = 'Hello';
      console.log(message);

      // reassigning variable values
      variable1 = 5;
      console.log('Variable1 is :'+ variable1);

      variable1 = variable1 + 1
      console.log('Variable1 + 1 is :'+ variable1);

    </script>

  </body>

</html>
