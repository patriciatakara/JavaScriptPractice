      //11.k
      let ar3 = [1,-3,5,2,-6];
      function countPositive(nums){
        let r=0;
        let count=0;  
        while(r<=nums.length){
          if(nums[r]>0){
            count +=1;
          }
          r+=1;
        }
        return count;

      //11.l/m
      const none = [];
      const onlyOne = [3];
      function minMax(nums){
        const minAndMax = {min:null, max:null}
        if(nums.length !== 0){
          minAndMax.min = Math.min(...nums);// we use ... to spread the array elements into individual elements, so JS can evaluate it. We cannot pass a entire array. JS expects individual elements.
          minAndMax.max = Math.max(...nums);
        }
        return minAndMax;
      }
      console.log(minMax(ar3));

      console.log(minMax(onlyOne));

      //11.n
      const unString = ['apple','lime', 'orange', 'apple','lime', 'apple', 'peach']
      
      function countWords(text){
        const result = {};  // creates an empty object
        //for each word in text
        for(let i=0; i<text.length; i++){
          //get the current word
          const word = text[i]
          //if the current word does not exist in result object
          if(!result[word]){ //if apple is not 1, then
            result[word] = 1; //add the word to the object with a count of 1 -> apple:1
          }else{
            result[word]++; //otherwise, increase its count by 1
          }
        }
        return result
      }
      console.log(countWords(unString));

      //11.r - remove all eggs
      const someFood = ['egg','apple','brocoli','egg','spinach','tuna','ham','egg'];
      function removeEgg(foods){
        foodList = [];
        for(let i=0; i<foods.length; i++){
          if(foods[i] === 'egg'){
            continue;
          }else{
            foodList.push(foods[i]);
          }
        }
        return foodList;
      }
      console.log(`No eggs: ${removeEgg(someFood)}`);


      //11.s - remove first 2 eggs only
      function remove2Eggs(foods){
        foodList = [];
        count = 0;
        for(let i=0; i<foods.length; i++){
          if(foods[i] === 'egg' && count<2){
            count +=1;
            continue;
          }else{
            foodList.push(foods[i]);
          }
        }
        return foodList;
      }
      console.log(`Remove 2 initial eggs: ${remove2Eggs(someFood)}`);

      //11.t/u -reverse array and remove 2 last eggs

      console.log(lastFruit);
      console.log((remove2Eggs(lastFruit.reverse())).reverse());
