    <script>
      
      // Order of operations: >,< is lower than *, /, +, -
      console.log(5 == '5'); // true (type doesn't matter, only value)
      console.log(5 === '5'); // false (number vs string)   
      console.log(5 *2 > 7); // true (10 > 7)


      // If statements
      //If true, run the code in the block. If false, skip the block.
      if(4>2){
        console.log('4 is greater than 2');
      }

      if(4>9){
        console.log('4 is greater than 9'); // SKIPPED
      }
      else{
        console.log('4 is not greater than 9'); // THIS WILL BE DISPLAYED
      }

      // Check someone is old enough to drive
      const age = 23;
      if(age<16){
        console.log('Not old enough to drive and drink');
      }else if(age<22){
        console.log('Old enough to drive but not to drink');
      }else{
        console.log('Old enough to drive and drink');
      }
