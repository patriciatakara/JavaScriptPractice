<DOCTYPE html>
  <html>
  <head>
    <title>Project 06</title>
  </head>

  <body>
    <p>Cart Quantity</p> 

    <button onclick="
      console.log(`Cart Quantity: ${cartQuantity}`);">Show Quantity
    </button>

    <button onclick=" 
      if((cartQuantity+1) <=max){
        cartQuantity+=1 //or cartQuantity++
        console.log(`Cart Quantity: ${cartQuantity}`)
      }else{
        console.log(message);
      };">Add to Cart
    </button>

    <button onclick="
      if((cartQuantity+2) <=max){
        cartQuantity+=2;
        console.log(`Cart Quantity: ${cartQuantity}`)
      }else{
        console.log(message);
      };">+2
    </button>

    <button onclick="
      if((cartQuantity+3) <=max){
        cartQuantity+=3;
        console.log(`Cart Quantity: ${cartQuantity}`)
      }else{
        console.log(message);
      };">+3
    </button>

    <button onclick="cartQuantity=0;
      console.log('Cart was reset to 0');
      console.log(`Cart Quantity: ${cartQuantity}`);">Reset Cart
    </button>

    <button onclick=" 
      if((cartQuantity+4) <max){
        cartQuantity+=4;  
        console.log(`Cart Quantity: ${cartQuantity}`);
      }else{
        console.log(message);
      } ">+4
    </button>
    
    <button onclick="
     if((cartQuantity+5) <=max){
        cartQuantity+=5;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }else{
        console.log(message);
      }">+5
    </button>

    <button onclick="
      if(cartQuantity>0){
        cartQuantity--; 
        console.log(`Cart Quantity: ${cartQuantity}`);
      }else{
        alert(message2);
      };">Remove from cart
    </button>

    <button onclick="
      if((cartQuantity-2) >=0){
        cartQuantity-=2; 
        console.log(`Cart Quantity: ${cartQuantity}`);
      }else{
        alert(message3);
      }">-2
    </button>

    <button onclick="
      if((cartQuantity-3)>=0){
        cartQuantity-=3;
        console.log(`Cart Quantity: ${cartQuantity}`);
      }else{
        alert(message3);
      }">-3
    </button>

    <script>
      let cartQuantity = 0;
      const max =10;
      const message = 'The cart os full!'; 
      const message2 = 'Cart is empty.';
      const message3 = 'Not enough items in the cart.'
    </script>

  </body>
  </html>
</DOCTYPE>
