<!DOCTYPE html>
<html>
  <head>
    <title>09 Rock Paper Scissors </title>
  </head>

  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="playGame('rock');">Rock</button>
    <button onclick="playGame('paper');">Paper</button>
    <button onclick="playGame('scissors');">Scissors</button>
    <button onclick="playGame('reset'); localStorage.removeItem('score');">Reset Score</button>

    <p class = "js-result"></p>
    <p class = "js-move"></p>
    <p class = "js-score"></p>



    <script>     
  
    // Another way: using the default operator (remove codes [1] and [2]): 
      // This condense the code, it accomplishes what [1] and [2] do:   
    let score = JSON.parse(localStorage.getItem('score')) || {wins:0, losses:0, ties: 0};
  



       // Refresh the score shown on the page after saving the updated totals.
    displayScore();
    displayResult();
    displayMoves();

    function playGame(playerChoice) {
      let pC = Math.random();
      let result;
      if(playerChoice === "reset"){
        score.wins=0; 
        score.losses = 0; 
        score.ties = 0
        displayScore();
        return;
      }
    
      // PC picks a move
      if(pC >= 0 && pC < 1/3){
        pC = 'rock';
      }else if(pC >= 1/3 && pC <2/3){
        pC = 'paper';
      }else if(pC >= 2/3 && pC <1){
        pC ='scissors';
      }

      // Compare our move against the PC
      if (playerChoice === pC){
        result = 'Tie.';
        score.ties++;
      }else if(
        (playerChoice === 'rock' && pC === 'scissors') || 
        (playerChoice === 'paper' && pC === 'rock') ||
        (playerChoice === 'scissors' && pC === 'paper')){
          result = 'You win!';
          score.wins++; 
        }
      else{
        result = 'You lose.'
        score.losses++;
      }

      // Save the updated score so it persists after the page is refreshed.
      localStorage.setItem('score', JSON.stringify(score));

      // Refresh the result, moves, and score shown on the page after the latest round.
      displayScore();
      displayResult(result);
      displayMoves(playerChoice, pC);

      return 
    }
    
    // Update the score displayed on the page.
    function displayScore() {
      document.querySelector('.js-score').innerHTML =`Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}.`;
    }
      
    // Update the result displayed after each round.
    function displayResult(result){
      document.querySelector('.js-result').innerHTML =`${result}`;   
    }

    // Update the moves displayed after each round.
    function displayMoves(our,pc){
      document.querySelector('.js-move').innerHTML =`You<-${our} vs  ${pc} ->PC`;
    }

    </script>
  </body>
